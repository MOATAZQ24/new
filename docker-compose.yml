services:
  db:
    image: postgres:16.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-itops}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_ops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:-itops_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-db.sh:/docker-entrypoint-initdb.d/01-init-app-db.sh:ro
    expose:
      - "5432"
    networks:
      - itops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-it_ops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-itops}-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql://${APP_DB_USER:-itops_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:-it_ops}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SESSION_EXPIRE_HOURS: ${SESSION_EXPIRE_HOURS:-24}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","https://localhost","http://127.0.0.1","https://127.0.0.1","http://localhost:8088","https://localhost:8443"]}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      VAULT_DEV_MOCK: ${VAULT_DEV_MOCK:-true}
    volumes:
      - upload_data:/data/uploads
      - backup_data:/data/backups
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itops-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: ${COMPOSE_PROJECT_NAME:-itops}-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_INTERNAL_URL: http://backend:8000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itops-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-itops}-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - itops-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
  backup_data:

networks:
  itops-network:
    driver: bridge
