version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: itops-db-dev
    environment:
      POSTGRES_DB: it_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - itops-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itops-backend-dev
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-changeme}@db:5432/it_ops
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-not-for-production-use-1234567890}
      SESSION_EXPIRE_HOURS: ${SESSION_EXPIRE_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - upload_data_dev:/data/uploads
      - backup_data_dev:/data/backups
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itops-network-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itops-frontend-dev
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000/api/v1}
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - itops-network-dev
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
  upload_data_dev:
  backup_data_dev:

networks:
  itops-network-dev:
    driver: bridge
